<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c5c44">
<meta name="description" content="ميدان — نظام إدارة المندوبين الميدانيين والمحلات التجارية في العراق">
<title>ميدان — نظام إدارة المندوبين الميدانيين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<style>

/* ================= المتغيرات والأساس ================= */
:root{
  --bg:#f3f1ea; --surface:#fffdf8; --surface2:#f7f4ec; --line:#e4dfd2;
  --ink:#1c2a22; --ink2:#57685d; --ink3:#8d9c92;
  --primary:#1c5c44; --primary-soft:#e1ede6; --accent:#a96a12; --accent-soft:#f5ebd8;
  --danger:#b23a2e; --danger-soft:#f7e3df; --ok:#2e7d4f;
  --side:#122a1f; --side-ink:#cfe0d6; --side-ink2:#8fa89a;
  --radius:14px; --shadow:0 1px 2px rgba(28,42,34,.04),0 10px 28px -14px rgba(28,42,34,.16);
}
[data-theme="dark"]{
  --bg:#0f1512; --surface:#171f1a; --surface2:#1c2620; --line:#29352d;
  --ink:#e7e3d7; --ink2:#a3b3a8; --ink3:#6f8176;
  --primary:#3d9e76; --primary-soft:#1b3129; --accent:#d79c40; --accent-soft:#302718;
  --danger:#d16b5f; --danger-soft:#321f1c;
  --side:#0b120e; --side-ink:#c4d4ca; --side-ink2:#71857a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.5);
}
*{box-sizing:border-box} html,body{margin:0}
body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.65;-webkit-font-smoothing:antialiased;transition:background .25s}
h1,h2,h3{line-height:1.4;margin:0}
p{margin:0}
a{color:var(--primary)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.ic{width:18px;height:18px;flex:none}
.ic-xs{width:12px;height:12px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--ink3);font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
::selection{background:var(--primary-soft)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* ================= الشِل والتنقل ================= */
.sidebar{position:fixed;inset-block:0;inset-inline-start:0;width:250px;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;z-index:60;transition:transform .25s}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 16px}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand-mark .ic{width:21px;height:21px}
.brand b{font-size:17px;color:#fff;display:block;line-height:1.3}
.brand small{font-size:11px;color:var(--side-ink2)}
.snav{flex:1;overflow-y:auto;padding:6px 0}
.snav a{display:flex;align-items:center;gap:11px;margin:2px 10px;padding:10px 13px;border-radius:11px;color:var(--side-ink);text-decoration:none;font-weight:500;font-size:13.5px}
.snav a .ic{width:19px;height:19px;color:var(--side-ink2)}
.snav a:hover{background:rgba(255,255,255,.06)}
.snav a.on{background:var(--primary);color:#fff}
.snav a.on .ic{color:#fff}
.snav .sep{margin:12px 22px 6px;font-size:10.5px;color:var(--side-ink2);letter-spacing:.4px}
.side-foot{border-top:1px solid rgba(255,255,255,.08);padding:12px}
.user-card{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px}
.user-card .avat{background:rgba(255,255,255,.12);color:#fff}
.user-card b{color:#fff;font-size:13px;display:block;line-height:1.3}
.user-card small{color:var(--side-ink2);font-size:11px}
.user-card button{margin-inline-start:auto}
.main{margin-inline-start:250px;min-height:100vh;display:flex;flex-direction:column}
.content{padding:24px 28px 90px;max-width:1230px;width:100%;margin:0 auto;flex:1}
.topbar{position:sticky;top:0;z-index:45;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 20px}
.page-title{font-size:16.5px;font-weight:700}
.top-actions{margin-inline-start:auto;display:flex;align-items:center;gap:9px}
.user-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 12px 4px 5px;font-size:12.5px;font-weight:600}
.user-chip .avat{width:28px;height:28px;font-size:12px}
.backdrop{position:fixed;inset:0;background:rgba(10,16,12,.45);z-index:55;opacity:0;pointer-events:none;transition:.2s}
.backdrop.show{opacity:1;pointer-events:auto}
.bottomnav{display:none;position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);z-index:50;padding:5px 8px calc(5px + env(safe-area-inset-bottom))}
.bnav{display:flex;align-items:center}
.bnav a,.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:10.5px;color:var(--ink3);text-decoration:none;border:none;background:none;font-weight:500;border-radius:10px}
.bnav .on{color:var(--primary);font-weight:700}
.bnav .fab{flex:0 0 66px;background:var(--primary);color:#fff;border-radius:15px;height:54px;display:flex;flex-direction:row;align-items:center;justify-content:center;margin-top:-20px;box-shadow:0 8px 20px -6px color-mix(in srgb,var(--primary) 55%,transparent);font-size:11px;font-weight:700;gap:4px}
@media(max-width:920px){
  .sidebar{transform:translateX(100%)} .sidebar.open{transform:none}
  .main{margin-inline-start:0} .content{padding:16px 14px 96px}
  .bottomnav{display:flex}
  .user-chip span{display:none} .user-chip{padding:3px;border-radius:99px}
  .only-d{display:none!important}
}
@media(min-width:921px){.only-m{display:none!important}}

/* ================= مكونات عامة ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:11px;padding:9px 16px;font-weight:600;font-size:13.5px;text-decoration:none;transition:.15s;background:transparent;color:var(--ink)}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:hover{filter:brightness(.92)}
.btn.soft{background:var(--primary-soft);color:var(--primary)}
.btn.ghost{border-color:var(--line);background:var(--surface)}
.btn.ghost:hover{border-color:var(--ink3)}
.btn.danger{background:var(--danger);color:#fff}
.btn.tdanger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent);background:var(--danger-soft)}
.btn.lg{padding:13px 22px;font-size:15px;border-radius:13px}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--surface);color:var(--ink2);flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--ink3)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:99px;animation:rot .7s linear infinite}
.spin.dark{border-color:color-mix(in srgb,var(--primary) 30%,transparent);border-top-color:var(--primary)}
@keyframes rot{to{transform:rotate(360deg)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.page-head h2{font-size:20px;font-weight:700}
.backlink{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink3);text-decoration:none;margin-bottom:4px}
.backlink:hover{color:var(--primary)}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--surface2);color:var(--ink2);border:1px solid var(--line);white-space:nowrap}
.badge.ok{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.badge.off{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.badge.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.badge.dim{color:var(--ink3)}
.avat{width:36px;height:36px;border-radius:99px;background:var(--primary-soft);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column-reverse;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{display:flex;align-items:center;gap:9px;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 12px 30px -8px rgba(0,0,0,.35);animation:tin .28s cubic-bezier(.2,.9,.3,1.2);max-width:92vw}
.toast .ic{color:#7fd8a5}
.toast.err{background:var(--danger);color:#fff}.toast.err .ic{color:#fff}
.toast.warn{background:var(--accent);color:#fff}.toast.warn .ic{color:#fff}
.toast.out{opacity:0;transform:translateY(8px);transition:.35s}
@keyframes tin{from{opacity:0;transform:translateY(12px) scale(.95)}}
.ovl{position:fixed;inset:0;background:rgba(9,15,11,.52);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .18s}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:580px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:pop .22s cubic-bezier(.2,.9,.3,1.15)}
.modal.sm{max-width:430px}.modal.lg{max-width:700px}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(10px)}}
@keyframes fade{from{opacity:0}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:15px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2;border-radius:18px 18px 0 0}
.modal-h h3{font-size:15.5px}
.modal-b{padding:18px 20px}
.modal-act{display:flex;gap:10px;padding:4px 20px 20px}
.sheet{position:fixed;inset-inline:0;bottom:0;margin-inline:auto;background:var(--surface);border-radius:18px 18px 0 0;max-width:520px;z-index:210;animation:up .28s cubic-bezier(.2,.9,.3,1);padding:10px 14px calc(16px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(100%)}}
.sheet-item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;padding:13px 10px;border-radius:12px;font-size:14px;font-weight:600;color:var(--ink);text-align:right;text-decoration:none}
.sheet-item:hover{background:var(--surface2)}
.field{margin-bottom:14px}
.field>label{display:block;font-weight:600;font-size:12.5px;margin-bottom:6px;color:var(--ink2)}
.req{color:var(--danger);font-style:normal}
.ferr{color:var(--danger);font-size:11.5px;font-weight:600;margin-top:4px;min-height:2px}
.field.has-err .inp{border-color:var(--danger)}
.fhint{font-size:11.5px;color:var(--ink3);margin-top:4px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 13px;font-size:14px;color:var(--ink);outline:none;transition:border .15s}
.inp:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 14%,transparent)}
.inp:disabled{background:var(--surface2);color:var(--ink3)}
textarea.inp{resize:vertical;min-height:84px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.skel{background:linear-gradient(90deg,var(--surface2) 25%,var(--line) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shim 1.1s infinite;border-radius:12px}
@keyframes shim{to{background-position:-200% 0}}
.empty{padding:52px 20px;text-align:center;color:var(--ink3)}
.empty .ic{width:38px;height:38px;margin-bottom:10px;color:var(--ink3)}
.empty b{display:block;color:var(--ink2);font-size:15px;margin-bottom:4px}
.empty p{font-size:13px}

/* ================= الجداول ================= */
.tblwrap{overflow-x:auto;border-radius:0 0 var(--radius) var(--radius)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:right;font-size:11.5px;color:var(--ink3);font-weight:700;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
.tbl th:first-child{border-start-end-radius:var(--radius)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--surface2)}
.tbl tbody tr:last-child td{border-bottom:none}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
th.sortable .ic{width:12px;height:12px;vertical-align:-2px;opacity:.7}
.td-act{white-space:nowrap;text-align:left}
@media(max-width:920px){
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tbody tr{border:1px solid var(--line);border-radius:13px;margin-bottom:10px;padding:6px 4px;background:var(--surface)}
  .tbl tbody tr:hover{background:var(--surface)}
  .tbl td{border:none;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:7px 10px;text-align:left}
  .tbl td::before{content:attr(data-l);color:var(--ink3);font-size:11.5px;font-weight:700;flex:none}
  .tbl td.td-act{justify-content:flex-end}.tbl td.td-act::before{display:none}
  .tbl td.td-strong{font-weight:700;font-size:14px}.tbl td.td-strong::before{color:var(--ink2)}
}
.rowactions{display:inline-flex;gap:5px}
.rowactions .icon-btn{width:31px;height:31px;border-radius:8px}
.filters{display:flex;flex-wrap:wrap;gap:10px;padding:14px;margin-bottom:16px;align-items:flex-end}
.filters .f{min-width:135px;flex:1}
.filters .f>label{font-size:11px;font-weight:700;color:var(--ink3);display:block;margin-bottom:4px}
.filters .inp{padding:8px 11px;font-size:13px}
.filters .f.w2{flex:1.6}
.pgn{display:flex;align-items:center;gap:5px;justify-content:center;padding:14px;flex-wrap:wrap}
.pgn button{min-width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-weight:600;font-size:12.5px}
.pgn button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.pgn button:disabled{opacity:.35;cursor:default}
.pgn .dots{color:var(--ink3);padding:0 2px}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}

/* ================= لوحة التحكم ================= */
.dash-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}
.dash-grid .w{grid-column:1/-1}
@media(max-width:1000px){.dash-grid{grid-template-columns:1fr}}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 18px 0}
.card-h b{font-size:14px}
.card-h a{font-size:12px;text-decoration:none;font-weight:600}
.pulse-big{font-size:34px;font-weight:700;letter-spacing:-.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.qrow{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:none}
.qrow .qi{width:36px;height:36px;border-radius:11px;background:var(--surface2);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
.qrow b{margin-inline-start:auto;font-size:16px;font-variant-numeric:tabular-nums}
.qrow small{display:block;color:var(--ink3);font-size:11.5px}
.hbar{display:grid;grid-template-columns:88px 1fr 42px;align-items:center;gap:10px;padding:5px 0;font-size:12.5px}
.hbar>span:first-child{color:var(--ink2);font-weight:600}
.hbar .tr{height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:99px;background:var(--primary);width:0;transition:width .8s cubic-bezier(.2,.8,.3,1)}
.hbar.acc .tr i{background:var(--accent)}
.hbar b{text-align:left;font-variant-numeric:tabular-nums;color:var(--ink)}
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.lb-row:last-child{border-bottom:none}
.lb-row .bg{position:absolute;inset-inline-start:0;top:0;bottom:0;background:var(--primary-soft);width:0;transition:width .9s cubic-bezier(.2,.8,.3,1);z-index:0}
.lb-row>*{position:relative;z-index:1}
.lb-rank{width:26px;height:26px;border-radius:99px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--ink3);flex:none}
.lb-rank.top{background:var(--primary);color:#fff}
.lb-rank.top2{background:var(--accent);color:#fff}
.tl{position:relative;padding:4px 20px 8px 8px}
.tl::before{content:'';position:absolute;inset-inline-start:6px;top:10px;bottom:12px;width:2px;background:var(--line)}
.tli{position:relative;padding:6px 0;margin-inline-start:10px;font-size:12.5px}
.tli::before{content:'';position:absolute;inset-inline-start:-18px;top:13px;width:8px;height:8px;border-radius:99px;background:var(--primary);outline:3px solid var(--surface)}
.tli small{display:block;color:var(--ink3);font-size:11px}
.cta-add{display:flex;align-items:center;gap:14px;width:100%;background:var(--primary);color:#fff;border:none;border-radius:16px;padding:20px 22px;font-size:16.5px;font-weight:700;box-shadow:0 12px 26px -10px color-mix(in srgb,var(--primary) 60%,transparent);transition:.15s;text-decoration:none;justify-content:center}
.cta-add:hover{filter:brightness(.93)}
.cta-add .ic{width:24px;height:24px}
.stat-duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat-duo .card{padding:15px 17px}
.stat-duo b{font-size:24px;display:block;font-variant-numeric:tabular-nums}
.bar{transform-origin:bottom;transform-box:fill-box;animation:grow .55s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes grow{from{transform:scaleY(0)}}

/* ================= شاشة الدخول ================= */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--bg)}
.auth-form{display:flex;align-items:center;justify-content:center;padding:32px 22px}
.auth-card{width:100%;max-width:396px}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.auth-side{background:var(--side);color:var(--side-ink);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:56px}
.auth-side>*{position:relative;z-index:1}
.auth-side h2{color:#fff;font-size:26px;margin:26px 0 8px}
.feat{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:13.5px}
.feat .ic{color:var(--accent);margin-top:3px;width:20px;height:20px}
.auth-stats{display:flex;gap:26px;margin-top:38px;border-top:1px solid rgba(255,255,255,.1);padding-top:22px}
.auth-stats b{color:#fff;font-size:21px;display:block}
.auth-stats small{font-size:11.5px;color:var(--side-ink2)}
.demo-acc{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:10px 13px;margin-top:8px;transition:.15s}
.demo-acc:hover{border-color:var(--primary);background:var(--primary-soft)}
.demo-acc b{font-size:13px;display:block;color:var(--ink)}
.demo-acc small{font-size:11.5px;color:var(--ink3);font-family:monospace}
.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(5px)}40%,80%{transform:translateX(-5px)}}
@media(max-width:920px){.auth{grid-template-columns:1fr}.auth-side{display:none}}

/* ================= نماذج المحل والإعدادات ================= */
.form-sec{padding:18px;margin-bottom:16px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:16px;font-size:14px}
.sec-h .ic{color:var(--primary)}
.gps-row{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:10px;align-items:start}
@media(max-width:640px){.gps-row{grid-template-columns:1fr 1fr}.gps-row .g-full{grid-column:1/-1}}

.dup.sure .dup-h{color:var(--danger)}
.dup:not(.sure) .dup-h{color:var(--accent)}
.dup-item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:7px;font-size:12.5px;flex-wrap:wrap}
.imgprev{position:relative;width:132px;height:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.imgprev img{width:100%;height:100%;object-fit:cover;display:block}
.imgprev button{position:absolute;top:5px;inset-inline-start:5px;background:rgba(20,20,20,.65);color:#fff;border:none;border-radius:8px;width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.srow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.srow:last-child{border:none}
.sw{position:relative;width:40px;height:23px;border-radius:99px;background:var(--line);border:none;transition:.2s;flex:none}
.sw::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:17px;height:17px;border-radius:99px;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--primary)}
.sw.on::after{transform:translateX(-17px)}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;width:fit-content;margin-bottom:18px}
.tabs button{border:none;background:transparent;padding:8px 16px;border-radius:9px;font-weight:600;color:var(--ink2);font-size:13px}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.acc-h{display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;border-bottom:1px solid var(--line)}
.acc-h:hover{background:var(--surface2)}
.acc-b{border-bottom:1px solid var(--line);background:var(--surface2)}
.acc-b .srow{background:var(--surface);border-radius:10px;margin:6px 10px;border:1px solid var(--line)}

.detail-grid{display:grid;grid-template-columns:280px 1fr;gap:18px}

.dimg{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--surface2);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.dimg img{width:100%;height:100%;object-fit:cover}
.drow{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;align-items:baseline}
.drow:last-child{border:none}
.drow>span:first-child{color:var(--ink3);font-size:12px;min-width:88px;flex:none;font-weight:600}
#shopmap{height:290px;border-radius:var(--radius);border:1px solid var(--line);position:relative;z-index:1}
.pinmark{background:none;border:none}
.pin-dot{display:block;width:16px;height:16px;border-radius:99px;background:var(--primary);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}

async function sha256(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
 catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return'h'+h.toString(16)}}

function barChartSVG(data,{w=600,h=150}={}){
  const max=Math.max(...data.map(d=>d.n),1);
  const pad={t:10,b:24,l:4,r:4},iw=(w-pad.l-pad.r)/data.length,bw=Math.min(iw*.52,26);
  let bars='',labels='';
  data.forEach((d,i)=>{
    const x=pad.l+i*iw+(iw-bw)/2,bh=Math.max(3,(d.n/max)*(h-pad.t-pad.b)),y=h-pad.b-bh;
    bars+=`<rect class="bar" style="animation-delay:${i*32}ms" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="4" fill="${d.hi?'var(--accent)':'var(--primary)'}"><title>${esc(d.title)}: ${d.n} محل</title></rect>`;
    labels+=`<text x="${(x+bw/2).toFixed(1)}" y="${h-6}" font-size="9.5" fill="var(--ink3)" text-anchor="middle">${d.lbl}</text>`;
  });
  return`<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block" dir="ltr"><line x1="0" y1="${h-pad.b+1}" x2="${w}" y2="${h-pad.b+1}" stroke="var(--line)"/>${bars}${labels}</svg>`;
}
function hbars(list,cls=''){
  const max=Math.max(...list.map(x=>x.n),1);
  return`<div>${list.map(x=>`<div class="hbar ${cls}"><span class="ell" title="${esc(x.t)}">${esc(x.t)}</span><span class="tr"><i data-w="${(x.n/max*100).toFixed(1)}"></i></span><b>${fmtNum(x.n)}</b></div>`).join('')}</div>`;
}

        toast('تم حذف الحساب');draw();

function repFormModal(u,after){
  const isNew=!u;
  const m=openModal(`<div class="modal-h"><h3>${isNew?'إنشاء حساب مندوب جديد':'تعديل بيانات المندوب'}</h3><button class="icon-btn m-x">${icon('x')}</button></div>
  <div class="modal-b">
    ${fld({l:'الاسم الكامل',id:'rf-name',req:1,val:u?.name})}
    ${fld({l:'اسم المستخدم (للدخول)',id:'rf-user',req:1,dir:'ltr',val:u?.username,hint:'أحرف إنجليزية وأرقام فقط'})}
    <div class="grid2">${fld({l:'رقم الهاتف',id:'rf-phone',req:1,dir:'ltr',val:u?.phone,ph:'07XX XXX XXXX',half:1})}</div>
    ${fld({l:'المحافظة / منطقة العمل',id:'rf-gov',opts:[{v:'',t:'بدون تحديد'},...DB.governorates.map(g=>({v:g.id,t:g.name}))],val:u?DB.governorates.find(g=>g.name===u.assignedGov)?.id:''})}
    ${isNew?fld({l:'كلمة المرور الابتدائية',id:'rf-pass',req:1,dir:'ltr',val:'rep123',hint:'6 أحرف على الأقل — يُنصح بتغييرها عند أول دخول'}):''}
  </div>
  <div class="modal-act"><button class="btn primary" id="rf-save">${isNew?'إنشاء الحساب':'حفظ التعديلات'}</button><button class="btn ghost m-x">إلغاء</button></div>`);
  m.ov.querySelectorAll('.m-x').forEach(x=>x.onclick=m.close);
  $('#rf-save').onclick=async()=>{
    clearErrs(['rf-name','rf-user','rf-pass']);
    const name=getV('rf-name'),uname=getV('rf-user').toLowerCase(),phone=getV('rf-phone'),govId=getV('rf-gov'),pass=getV('rf-pass');
    let bad=false;
    if(name.length<3){setErr('rf-name','الاسم 3 أحرف على الأقل');bad=true}
    if(!/^[a-z0-9_.]{3,20}$/.test(uname)){setErr('rf-user','اسم مستخدم غير صالح (3-20 حرفًا إنجليزيًا)');bad=true}
    if(DB.users.some(x=>x.username.toLowerCase()===uname&&x.id!==u?.id)){setErr('rf-user','اسم المستخدم مستخدم مسبقًا');bad=true}
    const phOk=s=>{if(!s)return false;const d=s.replace(/\D/g,'');return d.length>=10&&d.length<=11&&d.startsWith('0')};
    if(!phOk(phone)){setErr('rf-phone','رقم عراقي صحيح مثل 07701234567');bad=true}
    if(isNew&&pass.length<6){setErr('rf-pass','6 أحرف على الأقل');bad=true}
    if(bad)return;
    const govName=govId?DB.governorates.find(g=>g.id===govId).name:null;
    if(isNew){
      const salt=newSalt();
      const nu={id:uid('u'),name,username:uname,phone,passwordHash:await hashPw(pass,salt),salt,role:'rep',status:'active',assignedGov:govName,createdAt:Date.now(),updatedAt:Date.now(),lastLoginAt:null};
      DB.users.push(nu);DB.representatives.push({id:uid('rp'),user_id:nu.id,assigned_governorate:govName,created_at:Date.now()});
      log(me().id,'rep_create','user',nu.id,`إنشاء حساب المندوب «${name}»${govName?' — '+govName:''}`);
      toast(`تم إنشاء حساب «${esc(name)}» بنجاح`);
    }else{
      Object.assign(u,{name,username:uname,phone,assignedGov:govName,updatedAt:Date.now()});
      DB.shops.forEach(s=>{if(s.repId===u.id)s.repName=name});
      log(me().id,'rep_update','user',u.id,`تعديل بيانات المندوب «${name}»`);
      toast('تم حفظ التعديلات');
    }
    save();m.close();after&&after();
  };
}

    <p class="muted" style="font-size:12.5px;margin-top:2px">المدير العام يملك جميع الصلاحيات ولا يمكن تعديله أو حذفه من هذه الصفحة. عند إضافة مدير جديد تحدد له الصلاحيات الممنوحة، فتظهر في قائمته الجانبية الصفحات المسموح بها فقط ويُمنع من فتح بقية الصفحات حتى لو كتب رابطها يدويًا. لا يستطيع أي مدير منح صلاحية لا يملكه هو نفسه. كل مدير يستطيع دائمًا الوصول إلى: الرئيسية، المحلات التجارية، إضافة المحلات، وحسابه الشخصي.</p></div>
  </div>
  <div class="card" style="margin-bottom:16px;padding:10px 14px;display:flex;gap:10px;align-items:center">
    <span style="color:var(--ink3)">${icon('search')}</span>
    <input class="inp" id="ad-q" placeholder="ابحث بالاسم أو اسم المستخدم أو الهاتف…" style="border:none;background:none;padding:4px;box-shadow:none">
  </div>
  <div class="card"><div class="tblwrap"><table class="tbl">
    <thead><tr><th>المدير</th><th>اسم المستخدم</th><th>الهاتف</th><th>الصلاحيات</th><th>تاريخ الإنشاء</th><th>آخر دخول</th><th>الحالة</th><th style="text-align:left">الإجراءات</th></tr></thead>
    <tbody id="ad-body"></tbody>
  </table></div></div>`;
  const draw=()=>{
    const q=normAr(state.adminQ||'');
    const rows=DB.users.filter(u=>u.role==='admin')
      .filter(u=>!q||normAr(u.name+u.username+u.phone).includes(q))
      .sort((a,b)=>(b.isSuper?1:0)-(a.isSuper?1:0)||a.createdAt-b.createdAt);
    $('#ad-count').textContent=`${rows.length} حساب مدير — منهم مدير عام واحد`;
    $('#ad-body').innerHTML=rows.map(u=>{
      const self=u.id===me().id;
      const titles=permTitlesOf(u);
      const badges=u.isSuper
        ?`<span class="badge acc">مدير عام — كل الصلاحيات</span>`
        :titles.length
          ?PERM_CATALOG.filter(p=>u.permissions[p.k]).slice(0,2).map(p=>`<span class="badge ok">${esc(p.t)}</span>`).join('')+(titles.length>2?`<span class="badge">+${titles.length-2}</span>`:'')
          :`<span class="badge dim">بدون صلاحيات</span>`;
      const acts=[`<button class="icon-btn" data-act="view" data-id="${u.id}" title="عرض التفاصيل">${icon('eye')}</button>`];
      if(!u.isSuper&&!self){
        acts.push(`<button class="icon-btn" data-act="edit" data-id="${u.id}" title="تعديل البيانات والصلاحيات">${icon('pencil')}</button>`);
        acts.push(`<button class="icon-btn" data-act="toggle" data-id="${u.id}" title="${u.status==='active'?'تعطيل':'تفعيل'}">${icon('power')}</button>`);
        acts.push(`<button class="icon-btn" data-act="reset" data-id="${u.id}" title="إعادة تعيين كلمة المرور">${icon('key')}</button>`);
        acts.push(`<button class="icon-btn" data-act="del" data-id="${u.id}" title="حذف" style="color:var(--danger)">${icon('trash')}</button>`);
      }
      if(self)acts.push(`<span class="badge dim" title="عدّل بياناتك من صفحة حسابي">حسابك</span>`);
      if(u.isSuper)acts.push(`<span class="badge acc" title="المدير العام لا يمكن تعديله من هنا">${icon('shield')}</span>`);
      return`<tr>
      <td data-l="المدير"><div style="display:flex;align-items:center;gap:9px"><span class="avat" style="width:31px;height:31px;font-size:12.5px;${u.isSuper?'background:var(--accent-soft);color:var(--accent)':''}">${esc(u.name[0])}</span><b>${esc(u.name)}</b></div></td>
      <td data-l="اسم المستخدم"><span style="font-family:monospace;direction:ltr;unicode-bidi:embed">${esc(u.username)}</span></td>
      <td data-l="الهاتف" class="tnum" style="direction:ltr;text-align:right">${esc(u.phone||'—')}</td>
      <td data-l="الصلاحيات"><span style="display:inline-flex;gap:4px;flex-wrap:wrap">${badges}</span></td>
      <td data-l="تاريخ الإنشاء">${fmtDate(u.createdAt)}</td>
      <td data-l="آخر دخول">${u.lastLoginAt?timeAgo(u.lastLoginAt):'لم يسجل دخولًا بعد'}</td>
      <td data-l="الحالة"><span class="badge ${u.status==='active'?'ok':'off'}">${u.status==='active'?'نشط':'معطّل'}</span></td>
      <td class="td-act" data-l="الإجراءات"><span class="rowactions">${acts.join('')}</span></td></tr>`;
    }).join('')||`<tr><td colspan="8"><div class="empty">${icon('shield')}<b>لا نتائج مطابقة</b></div></td></tr>`;
  };
  $('#ad-q').value=state.adminQ||'';
  $('#ad-q').addEventListener('input',debounce(e=>{state.adminQ=e.target.value;draw()},200));
  $('#ad-new').onclick=()=>adminFormModal(null,draw);
  $('#ad-body').addEventListener('click',async e=>{
    const b=e.target.closest('[data-act]');if(!b)return;
    const u=DB.users.find(x=>x.id===b.dataset.id);if(!u)return;
    const act=b.dataset.act;
    if(act==='view')return adminViewModal(u);
    if(act==='edit')return adminFormModal(u,draw);
    if(act==='toggle'){
      if(u.isSuper)return toast('لا يمكن تعطيل المدير العام','err');
      if(u.id===me().id)return toast('لا يمكنك تعطيل حسابك الحالي','err');
      const to=u.status==='active'?'disabled':'active';
      if(await confirmDialog({title:to==='disabled'?'تعطيل حساب مدير':'تفعيل حساب مدير',danger:to==='disabled',okText:to==='disabled'?'تعطيل':'تفعيل',
        msg:to==='disabled'?`سيُمنع <b>${esc(u.name)}</b> من تسجيل الدخول، وتبقى صلاحياته وبياناته محفوظة كما هي.`:`سيتمكن <b>${esc(u.name)}</b> من تسجيل الدخول مجددًا بنفس صلاحياته السابقة.`})){
        u.status=to;u.updatedAt=Date.now();save();
        log(me().id,'admin_toggle','user',u.id,`${to==='disabled'?'تعطيل':'تفعيل'} حساب المدير «${u.name}»`);
        toast(to==='disabled'?'تم تعطيل الحساب':'تم تفعيل الحساب');draw();
      }return;
    }
    if(act==='reset'){
      const m=openModal(`<div class="modal-h"><h3>إعادة تعيين كلمة المرور</h3><button class="icon-btn m-x">${icon('x')}</button></div>
        <div class="modal-b">${fld({l:`كلمة مرور جديدة للمدير ${esc(u.name)}`,id:'apw-new',req:1,type:'text',dir:'ltr',hint:'6 أحرف على الأقل',val:''})}
        <button class="btn ghost sm" id="apw-gen">${icon('key')}توليد كلمة مرور قوية</button></div>
        <div class="modal-act"><button class="btn primary" id="apw-save">حفظ كلمة المرور</button><button class="btn ghost m-x">إلغاء</button></div>`,'sm');
      m.ov.querySelectorAll('.m-x').forEach(x=>x.onclick=m.close);
      $('#apw-gen').onclick=()=>{$('#apw-new').value='Md'+Math.random().toString(36).slice(2,10)};
      $('#apw-save').onclick=async()=>{
        const p=getV('apw-new');clearErrs(['apw-new']);
        if(p.length<6)return setErr('apw-new','كلمة المرور 6 أحرف على الأقل');
        u.salt=newSalt();u.passwordHash=await hashPw(p,u.salt);u.updatedAt=Date.now();save();
        log(me().id,'admin_reset','user',u.id,`إعادة تعيين كلمة مرور المدير «${u.name}»`);
        m.close();toast('تم تحديث كلمة المرور بنجاح');
      };return;
    }
    if(act==='del'){
      if(u.isSuper)return toast('لا يمكن حذف المدير العام','err');
      if(u.id===me().id)return toast('لا يمكنك حذف حسابك الحالي','err');
      if(await confirmDialog({title:'حذف حساب المدير',danger:1,okText:'حذف نهائي',
        msg:`سيُحذف حساب المدير <b>${esc(u.name)}</b> نهائيًا مع صلاحياته.<br>لن يتمكن من تسجيل الدخول بعد الآن، ولا يمكن التراجع عن هذه العملية.`})){
        DB.users=DB.users.filter(x=>x.id!==u.id);save();
        log(me().id,'admin_delete','user',u.id,`حذف حساب المدير «${u.name}»`);
        toast('تم حذف الحساب');draw();
      }return;
    }
  });
  draw();
}

/* ---------- نافذة إضافة / تعديل مدير مع الصلاحيات ---------- */
function adminFormModal(u,after){
  const isNew=!u;
  const cur=me();
  const grantable=cur.isSuper?PERM_CATALOG:PERM_CATALOG.filter(p=>can(p.k));
  const curPerms=u?(u.permissions||{}):{};
  const m=openModal(`<div class="modal-h"><h3>${isNew?'إضافة مدير جديد':'تعديل بيانات المدير والصلاحيات'}</h3><button class="icon-btn m-x">${icon('x')}</button></div>
  <div class="modal-b">
    ${fld({l:'الاسم الكامل',id:'af-name',req:1,val:u?.name,ph:'مثال: علي حسن المحمودي'})}
    <div class="grid2">
      ${fld({l:'اسم المستخدم (للدخول)',id:'af-user',req:1,dir:'ltr',val:u?.username,hint:'أحرف إنجليزية وأرقام فقط',half:1})}
      ${fld({l:'رقم الهاتف',id:'af-phone',req:1,dir:'ltr',val:u?.phone,ph:'07XX XXX XXXX',half:1})}
    </div>
    ${isNew?fld({l:'كلمة المرور الابتدائية',id:'af-pass',req:1,dir:'ltr',val:'admin123',hint:'6 أحرف على الأقل — يُنصح بتغييرها عند أول دخول'}):''}
    <div class="sec-h" style="margin-top:8px;margin-bottom:6px">${icon('shield')}<b>صلاحيات الوصول</b></div>
    <p class="fhint" style="margin:0 0 10px">${cur.isSuper?'حدّد الأقسام التي يستطيع هذا المدير الوصول إليها — الصفحات غير الممنوحة تُخفى من قائمته ويُمنع من فتحها مباشرة.':'بصفتك مديرًا لا تملك كل الصلاحيات، يمكنك منح الصلاحيات التي تملكها فقط.'}</p>
    <div style="border:1px solid var(--line);border-radius:13px;overflow:hidden">
      ${PERM_CATALOG.map(p=>{
        const allowed=grantable.some(g=>g.k===p.k);
        const on=allowed&&!!curPerms[p.k];
        return`<div class="srow" style="padding:11px 14px;${allowed?'':'opacity:.5'}">
          <span class="qi" style="width:32px;height:32px;border-radius:10px;background:var(--surface2);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;flex:none">${icon(p.ic)}</span>
          <div style="min-width:0;flex:1"><b style="font-size:13px">${p.t}</b><br><small class="muted" style="font-size:11.5px">${p.d}</small></div>
          ${allowed?`<button type="button" class="sw ${on?'on':''}" data-pk="${p.k}" title="${p.t}" aria-label="${p.t}"></button>`:`<span class="badge dim">غير متاحة لك</span>`}
        </div>`}).join('')}
    </div>
    <p class="fhint" style="margin-top:8px">كل مدير يستطيع دائمًا الوصول إلى: الرئيسية، المحلات التجارية، إضافة المحلات، وحسابه الشخصي — بغض النظر عن الصلاحيات أعلاه.</p>
  </div>
  <div class="modal-act"><button class="btn primary" id="af-save">${isNew?'إنشاء الحساب':'حفظ التعديلات'}</button><button class="btn ghost m-x">إلغاء</button></div>`,'lg');
  m.ov.querySelectorAll('.m-x').forEach(x=>x.onclick=m.close);
  m.ov.querySelector('.modal-b').addEventListener('click',e=>{
    const sw=e.target.closest('.sw[data-pk]');if(sw)sw.classList.toggle('on');
  });
  $('#af-save').onclick=async()=>{
    clearErrs(['af-name','af-user','af-phone','af-pass']);
    const name=getV('af-name'),uname=getV('af-user').toLowerCase(),phone=getV('af-phone'),pass=getV('af-pass');
    /* بناء الصلاحيات: الممنوح مني تُؤخذ من المفاتيح، وغير الممنوح تُحفظ قيمتها السابقة كما هي */
    const permissions={};
    PERM_CATALOG.forEach(p=>{
      if(!grantable.some(g=>g.k===p.k)){if(curPerms[p.k])permissions[p.k]=true;return}
      const sw=m.ov.querySelector(`.sw[data-pk="${p.k}"]`);
      if(sw&&sw.classList.contains('on'))permissions[p.k]=true;
    });
    let bad=false;
    if(name.length<3){setErr('af-name','الاسم 3 أحرف على الأقل');bad=true}
    if(!/^[a-z0-9_.]{3,20}$/.test(uname)){setErr('af-user','اسم مستخدم غير صالح (3-20 حرفًا إنجليزيًا)');bad=true}
    if(DB.users.some(x=>x.username.toLowerCase()===uname&&x.id!==u?.id)){setErr('af-user','اسم المستخدم مستخدم مسبقًا');bad=true}
    const phOk=s=>{if(!s)return false;const d=s.replace(/\D/g,'');return d.length>=10&&d.length<=11&&d.startsWith('0')};
    if(!phOk(phone)){setErr('af-phone','رقم عراقي صحيح مثل 07701234567');bad=true}
    if(isNew&&pass.length<6){setErr('af-pass','6 أحرف على الأقل');bad=true}
    if(bad)return;
    const permSummary=PERM_CATALOG.filter(p=>permissions[p.k]).map(p=>p.t).join('، ')||'بدون صلاحيات إضافية';
    if(isNew){
      const salt=newSalt();
      const nu={id:uid('u'),name,username:uname,phone,passwordHash:await hashPw(pass,salt),salt,role:'admin',status:'active',isSuper:false,permissions,assignedGov:null,createdAt:Date.now(),updatedAt:Date.now(),lastLoginAt:null};
      DB.users.push(nu);
      log(me().id,'admin_create','user',nu.id,`إنشاء حساب مدير «${name}» — الصلاحيات: ${permSummary}`);
      toast(`تم إنشاء حساب المدير «${esc(name)}» بنجاح`);
    }else{
      if(u.isSuper)return m.close();
      Object.assign(u,{name,username:uname,phone,permissions,updatedAt:Date.now()});
      log(me().id,'admin_update','user',u.id,`تعديل بيانات وصلاحيات المدير «${name}» — الصلاحيات: ${permSummary}`);
      toast('تم حفظ التعديلات');
    }
    save();m.close();after&&after();
  };
}

/* ============================================================
   صفحة المحلات التجارية (بحث + فلاتر + ترتيب + ترقيم + تصدير)
   ============================================================ */
async function PageShops(root){
  await delay(120);
  const isRep=me().role==='rep';
  if(!state.shopFilters)state.shopFilters={q:'',gov:'',city:'',type:'',rep:'',from:'',to:'',sort:'createdAt',dir:'desc',page:1,per:10};
  const F=state.shopFilters;
  if(isRep)F.rep=me().id;
  root.innerHTML=`
  <div class="page-head"><div><h2>${isRep?'محلاتي المسجلة':'المحلات التجارية'}</h2><p class="muted" id="sh-count">…</p></div>
    <a class="btn primary" href="#/shop-new">${icon('plus')}محل جديد</a></div>
  <div class="card filters">
    <div class="f w2" style="min-width:190px"><label>بحث فوري</label><input class="inp" id="f-q" placeholder="اسم المحل، صاحبه، الهاتف، العنوان…" value="${esc(F.q)}"></div>
    <div class="f"><label>المحافظة</label><select class="inp" id="f-gov">${govOpts().map(o=>`<option value="${o.v}"${o.v===F.gov?' selected':''}>${o.t}</option>`).join('')}</select></div>
    <div class="f"><label>المدينة / القضاء</label><select class="inp" id="f-city" ${F.gov?'':'disabled'}><option value="">كل المدن</option></select></div>
    <div class="f"><label>نوع النشاط</label><select class="inp" id="f-type">${typeOpts().map(o=>`<option value="${o.v}"${o.v===F.type?' selected':''}>${esc(o.t)}</option>`).join('')}</select></div>
    ${isRep?'':`<div class="f"><label>المندوب</label><select class="inp" id="f-rep">${repOpts().map(o=>`<option value="${o.v}"${o.v===F.rep?' selected':''}>${esc(o.t)}</option>`).join('')}</select></div>`}
    <div class="f" style="max-width:150px"><label>من تاريخ</label><input type="date" class="inp" id="f-from" value="${F.from}"></div>
    <div class="f" style="max-width:150px"><label>إلى تاريخ</label><input type="date" class="inp" id="f-to" value="${F.to}"></div>
    <div class="f" style="max-width:118px;flex:none"><label>&nbsp;</label><button class="btn ghost" id="f-clear" style="width:100%">مسح الفلاتر</button></div>
  </div>
  <div class="card">
    <div class="tblwrap"><table class="tbl" id="sh-table"><thead id="sh-thead"></thead><tbody id="sh-body"></tbody></table></div>
    <div class="tfoot"><span class="muted" id="sh-range"></span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost sm" id="ex-csv">${icon('download')}تصدير CSV</button>
        <button class="btn ghost sm" id="ex-xls">${icon('file')}تصدير Excel</button>
        <button class="btn ghost sm" id="ex-print">${icon('printer')}طباعة</button>
      </div></div>
  </div>`;
  if(F.gov)fillCitySel('f-city',F.gov,F.city,'كل المدن');
  const cols=[
    {k:'name',t:'اسم المحl'.replace('l','ل')},
    {k:'owner',t:'صاحب المحل'},{k:'type',t:'النشاط'},{k:'gov',t:'المحافظة'},{k:'city',t:'المدينة'},{k:'addr',t:'العنوان'},
    ...(isRep?[]:[{k:'rep',t:'المندوب'}]),{k:'date',t:'تاريخ الإضافة'},{k:'x',t:'الإجراءات'}
  ];
  const SORTABLE=['name','owner','type','gov','city','date'];
  function computeVM(){
    const q=normAr(F.q);
    let list=DB.shops.filter(s=>{
      if(isRep&&s.repId!==me().id)return false;
      if(F.rep&&s.repId!==F.rep)return false;
      if(F.gov&&s.govId!==F.gov)return false;
      if(F.city&&s.cityId!==F.city)return false;
      if(F.type&&s.typeId!==F.type)return false;

   نموذج إضافة / تعديل محل (مع كشف التكرار و GPS والصورة)

function findDupes(name,govId,phone,owner,excludeId){
  const nName=normAr(name);if(nName.length<3)return[];
  const ph=phonesOnly(phone),ow=normAr(owner);
  const out=[];
  for(const s of DB.shops){
    if(s.id===excludeId)continue;
    const ns=sim(nName,normAr(s.name));if(ns<.72)continue;
    let score=ns*2;
    const govM=!!govId&&s.govId===govId;if(govM)score+=.8;
    const phM=!!ph&&((ph&&ph===phonesOnly(s.phoneOwner))||ph===phonesOnly(s.phoneShop));if(phM)score+=1.6;
    const owM=!!ow&&sim(ow,normAr(s.ownerName))>=.85;if(owM)score+=.5;
    const sure=ns>=.92&&(govM||phM);
    out.push({s,ns,score,sure});
  }
  return out.filter(x=>x.score>=2.25).sort((a,b)=>b.score-a.score).slice(0,6);
}
function compressImage(file,maxW=760,q=.72){
  return new Promise(res=>{
    const rd=new FileReader();
    rd.onload=()=>{const img=new Image();img.onload=()=>{
      const sc=Math.min(1,maxW/img.width),w=Math.round(img.width*sc),h=Math.round(img.height*sc);
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',q));};img.src=rd.result;};
    rd.readAsDataURL(file);
  });
}

    const v={name:getV('sf-name'),owner:getV('sf-owner'),type:getV('sf-type'),gov:getV('sf-gov'),city:getV('sf-city'),addr:getV('sf-addr'),po:getV('sf-po'),ps:getV('sf-ps')};
    let bad=false;
    if(v.name.length<3){setErr('sf-name','اسم المحل 3 أحرف على الأقل');bad=true}
    if(v.owner.length<3){setErr('sf-owner','اسم صاحب المحل إجباري');bad=true}
    if(!v.type){setErr('sf-type','اختر نوع النشاط');bad=true}
    /* إذا اختار «نشاط تجاري آخر» يجب إدخال نص يدوي */
    const otherTypeName='نشاط تجاري آخر';
    const selTypeName=(()=>{const t=DB.types.find(x=>x.id===v.type);return t?t.name:''})();
    const isOtherSel=selTypeName===otherTypeName;
    const vOther=getV('sf-type-other');
    if(isOtherSel&&vOther.length<2){setErr('sf-type-other','اكتب نوع النشاط التجاري بدقة');bad=true}
    if(!v.gov){setErr('sf-gov','اختر المحافظة');bad=true}
    if(!v.city){setErr('sf-city','اختر المدينة / القضاء');bad=true}
    if(v.addr.length<5){setErr('sf-addr','اكتب عنوانًا واضحًا للوصول للمحل');bad=true}
    const phOk=s=>{if(!s)return true;const d=s.replace(/\D/g,'');return d.length>=10&&d.length<=11&&d.startsWith('0')};
    if(!phOk(v.po)){setErr('sf-po','رقم عراقي صحيح مثل 07701234567');bad=true}
    if(!phOk(v.ps)){setErr('sf-ps','رقم عراقي صحيح مثل 07701234567');bad=true}
    if(bad){toast('يرجى إكمال الحقول المطلوبة المشار إليها','warn');$('.field.has-err')?.scrollIntoView({behavior:'smooth',block:'center'});return}
    if(curSure&&!dupOverride){toast('يوجد تطابق مؤكد مع محل مسجل — راجع التنبيه أعلى النموذج','err');$('#dup-zone').scrollIntoView({behavior:'smooth'});return}
    const btn=$('#sf-save');btn.disabled=true;btn.innerHTML=`<span class="spin"></span> جارٍ الحفظ…`;
    await delay(180);
    const repId=isRep?me().id:getV('sf-rep');
    if(!repId){btn.disabled=false;btn.innerHTML=`${icon('check')}حفظ المحل`;setErr('sf-rep','اختر المندوب المسؤول');return}
    const base={name:v.name,ownerName:v.owner,typeId:v.type,govId:v.gov,cityId:v.city,address:v.addr,
      phoneOwner:v.po,phoneShop:v.ps,notes:getV('sf-notes'),
      /* حفظ النشاط المُدخل يدويًا فقط عند اختيار «نشاط تجاري آخر» */
      customType:isOtherSel?vOther:'',
      latitude:getV('sf-lat')?+getV('sf-lat'):null,longitude:getV('sf-lng')?+getV('sf-lng'):null,image:imgUrl};
    if(isEdit){
      Object.assign(shop,base,{repId,updatedAt:Date.now()});denorm(shop);save();
      log(me().id,'shop_update','shop',shop.id,`تعديل المحل «${shop.name}» — ${shop.govName}/${shop.cityName}`);
      toast('تم حفظ تعديلات المحل بنجاح');location.hash='#/shop-view/'+shop.id;
    }else{
      const s={id:uid('sh'),...base,repId,createdAt:Date.now(),updatedAt:Date.now()};
      denorm(s);DB.shops.unshift(s);save();
      const g=DB.governorates.find(x=>x.id===v.gov);
      log(me().id,'shop_create','shop',s.id,`إضافة محل «${s.name}» — ${g.name}/${s.cityName}`);
      toast(`تم تسجيل «${esc(s.name)}» بنجاح`);
      location.hash='#/shop-view/'+s.id;
    }
  });
}

function buildRows(mode,list,from,to){
  const pct=(n,d)=>d?Math.round(n/d*100)+'%':'0%';
  const base={name:n=>n.name,owner:n=>n.ownerName,type:n=>n.typeName,gov:n=>n.govName,city:n=>n.cityName,addr:n=>n.address,rep:n=>n.repName||'—',phone:n=>n.phoneOwner||n.phoneShop||'—',date:n=>fmtDate(n.createdAt)};
  if(mode==='detail')return{cols:[{k:'name',t:'اسم المحل'},{k:'owner',t:'صاحب المحل'},{k:'type',t:'النشاط'},{k:'gov',t:'المحافظة'},{k:'city',t:'المدينة'},{k:'addr',t:'العنوان'},{k:'rep',t:'المندوب'},{k:'date',t:'التاريخ'}],
    rows:list.slice(0,300).map(n=>({name:n.name,owner:n.ownerName,type:n.typeName,gov:n.govName,city:n.cityName,addr:n.address,rep:n.repName||'—',phone:n.phoneOwner||n.phoneShop||'—',date:fmtDate(n.createdAt)})),all:list.length,cut:list.length>300};
  const grp=(keyF,title)=>{
    const m=new Map();
    list.forEach(s=>{const k=keyF(s);m.set(k,(m.get(k)||0)+1)});
    const arr=[...m.entries()].map(([t,n])=>({t,n})).sort((a,b)=>b.n-a.n);
    return{cols:[{k:'t',t:title},{k:'n',t:'عدد المحلات',num:1},{k:'p',t:'النسبة'}],rows:arr.map(x=>({...x,p:pct(x.n,list.length)})),chart:arr};
  };
  if(mode==='byGov')return grp(s=>s.govName,'المحافظة');
  if(mode==='byType')return grp(s=>s.typeName,'نوع النشاط');
  if(mode==='byRep'){
    const m=new Map();
    list.forEach(s=>{const k=s.repName||'—';m.set(k,(m.get(k)||0)+1)});
    const arr=[...m.entries()].map(([t,n])=>({t,n,total:shopCountOfRep(DB.users.find(u=>u.name===t)?.id)})).sort((a,b)=>b.n-a.n);
    return{cols:[{k:'t',t:'المندوب'},{k:'n',t:'محلات الفترة',num:1},{k:'total',t:'إجمالي محلاته',num:1},{k:'p',t:'حصته من الفترة'}],rows:arr.map(x=>({...x,p:pct(x.n,list.length)})),chart:arr};
  }
  if(mode==='perf'){
    const reps=DB.users.filter(u=>u.role==='rep');
    const rows=reps.map(u=>{
      const mine=list.filter(s=>s.repId===u.id);
      const last=mine.length?Math.max(...mine.map(s=>s.createdAt)):null;
      const days=Math.max(1,Math.ceil(((to===Infinity?Date.now():to)-from)/864e5)||1);
      return{t:u.name,st:u.status,n:mine.length,total:shopCountOfRep(u.id),avg:(mine.length/days).toFixed(1),last:last?fmtDate(last):'—'};
    }).sort((a,b)=>b.n-a.n);
    return{cols:[{k:'t',t:'المندوب'},{k:'st',t:'الحالة'},{k:'n',t:'محلات الفترة',num:1},{k:'avg',t:'معدل يومي',num:1},{k:'total',t:'الإجمالي الكلي',num:1},{k:'last',t:'آخر إضافة'}],rows,chart:rows.map(r=>({t:r.t,n:r.n}))};
  }
  /* الزمني */
  const span=(to===Infinity?Date.now():to)-from,days=Math.ceil(span/864e5);
  const daily=days<=62;
  const m=new Map();
  list.forEach(s=>{const k=daily?isoDay(s.createdAt):isoDay(s.createdAt).slice(0,7);m.set(k,(m.get(k)||0)+1)});
  const arr=[...m.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
  return{cols:[{k:'t',t:daily?'اليوم':'الشهر'},{k:'n',t:'عدد المحلات المضافة',num:1}],rows:arr.map(([t,n])=>({t,n})),chart:arr.map(([t,n])=>({t,n})),daily};
}

  ${R.chart&&R.chart.length>1?`<div class="card" style="padding:16px 18px;margin-bottom:16px"><div class="card-h" style="padding:0 0 8px"><b>التوزيع البصري</b></div>${hbars(R.chart.slice(0,12).map(x=>({t:x.t,n:x.n})))}</div>`:''}

  <div class="card"><div class="tblwrap"><table class="tbl">

  $('#rr-xls').onclick=()=>{exportXLS(cols,R.rows,`تقرير-ميدان-${isoDay(Date.now())}`,modes[f.mode]);log(me().id,'export','report',null,`تصدير ${modes[f.mode]} إلى Excel (${R.rows.length} صف)`);toast('تم تصدير التقرير إلى Excel')};

/* ============================================================
   سجل النشاط (مدير)
   ============================================================ */
async function PageActivity(root){
  await delay(85);
  const F={act:'',user:'',q:'',page:1,per:15};
  const actions=[...new Set(DB.logs.map(l=>l.action))];
  const users=[...new Set(DB.logs.map(l=>l.userName))];
  root.innerHTML=`
  <div class="page-head"><div><h2>سجل نشاط المندوبين</h2><p class="muted">كل عملية مهمة في النظام مسجلة بالمستخدم والوقت والبيانات المتأثرة.</p></div></div>
  <div class="card filters">
    <div class="f w2"><label>بحث في التفاصيل</label><input class="inp" id="lg-q" placeholder="ابحث في وصف العمليات…"></div>
    <div class="f"><label>نوع العملية</label><select class="inp" id="lg-act"><option value="">كل العمليات</option>${actions.map(a=>`<option value="${a}">${ACTION_L[a]?ACTION_L[a][0]:a}</option>`).join('')}</select></div>
    <div class="f"><label>المستخدم</label><select class="inp" id="lg-user"><option value="">كل المستخدمين</option>${users.map(u=>`<option value="${esc(u)}">${esc(u)}</option>`).join('')}</select></div>
  </div>
  <div class="card"><div class="tblwrap"><table class="tbl">
    <thead><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th><th>التفاصيل والسجل المتأثر</th></tr></thead>
    <tbody id="lg-body"></tbody></table></div>
    <div class="tfoot"><span class="muted" id="lg-count"></span><span></span></div>
  </div>`;
  function draw(){
    const q=normAr(F.q);
    let list=DB.logs.filter(l=>{
      if(F.act&&l.action!==F.act)return false;
      if(F.user&&l.userName!==F.user)return false;
      if(q&&!normAr(l.details+l.userName).includes(q))return false;
      return true;
    });
    const pages=Math.max(1,Math.ceil(list.length/F.per));
    if(F.page>pages)F.page=pages;
    const items=list.slice((F.page-1)*F.per,F.page*F.per);
    $('#lg-count').textContent=`${fmtNum(list.length)} عملية مسجلة`;
    $('#lg-body').innerHTML=items.map(l=>{const al=ACTION_L[l.action]||[l.action,'badge'];return`<tr>
      <td data-l="الوقت">${fmtDate(l.createdAt)}<br><small class="muted">${fmtTime(l.createdAt)} · ${timeAgo(l.createdAt)}</small></td>
      <td data-l="المستخدم"><b>${esc(l.userName)}</b></td>
      <td data-l="العملية"><span class="${al[1]}">${al[0]}</span></td>
      <td data-l="التفاصيل">${esc(l.details)}</td></tr>`}).join('')
      ||`<tr><td colspan="4"><div class="empty">${icon('act')}<b>لا عمليات مطابقة</b></div></td></tr>`;
    let pg='';const old=$('#lg-pgn');if(old)old.remove();
    if(pages>1){
      for(let p=1;p<=pages&&p<=12;p++)pg+=`<button data-p="${p}" class="${p===F.page?'on':''}">${p}</button>`;
      if(pages>12)pg+='<span class="dots">…</span>';
      const n=el(`<div class="pgn" id="lg-pgn"><button data-p="prev" ${F.page===1?'disabled':''}>السابق</button>${pg}<button data-p="next" ${F.page===pages?'disabled':''}>التالي</button></div>`);
      $('#lg-pgn')?.remove();$('#lg-body').closest('.card').appendChild(n);
      n.onclick=e=>{const b=e.target.closest('[data-p]');if(!b||b.disabled)return;
        if(b.dataset.p==='prev')F.page--;else if(b.dataset.p==='next')F.page++;else F.page=+b.dataset.p;draw()};
    }
  }
  $('#lg-q').addEventListener('input',debounce(e=>{F.q=e.target.value;F.page=1;draw()},200));
  $('#lg-act').onchange=e=>{F.act=e.target.value;F.page=1;draw()};
  $('#lg-user').onchange=e=>{F.user=e.target.value;F.page=1;draw()};
  draw();
}

  <div class="tabs"><button data-tab="types">أنواع النشاط التجاري</button><button data-tab="govs">المحافظات والمدن</button></div>

          <button class="icon-btn" data-rn="${t.id}" title="إعادة تسمية">${icon('pencil')}</button>
        </div></div>`}).join('')}</div></div>`;
    $('#bt-new').onclick=()=>typeModal(null);

                <button class="icon-btn" data-cd="${c.id}" title="حذف" style="width:29px;height:29px;color:var(--danger)">${icon('trash')}</button></div></div>`).join('')}
            <div style="padding:8px 12px 14px"><button class="btn soft sm" data-ca="${g.id}">${icon('plus')}إضافة مدينة / قضاء</button></div>

    $('#gv-new').onclick=()=>{

      if(DB.users.some(x=>x.username.toLowerCase()===uname&&x.id!==u.id)){setErr('ac-user','اسم المستخدم مستخدم مسبقًا');bad=true}
      const phOk=s=>{if(!s)return false;const d=s.replace(/\D/g,'');return d.length>=10&&d.length<=11&&d.startsWith('0')};
      if(!phOk(phone)){setErr('ac-phone','رقم عراقي صحيح مثل 07701234567');bad=true}
      if(bad){toast('يرجى تصحيح الحقول المشار إليها','warn');return}
      /* تطبيق التعديلات على سجل المستخدم */
      Object.assign(full,{name,username:uname,phone,updatedAt:Date.now()});
      /* تحديث بيانات الجلسة الحالية لتنعكس فورًا */
      state.user=pubUser(full);
      save();
      log(u.id,'account_update','user',u.id,`تعديل بيانات حساب المدير الذاتي — «${name}»`);
      toast('تم حفظ التعديلات بنجاح');
      /* إعادة بناء الواجهة وإعادة رسم الصفحة */
      shellBuiltFor=null;
      route();
    };
  }
}

/* ============================================================
   أدوات التصدير
   ============================================================ */
function dlFile(name,content,mime){const b=new Blob([content],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
function exportCSV(cols,rows,label){
  const cell=v=>{let s=String(v??'');if(/^[=+\-@]/.test(s))s="'"+s;return'"'+s.replace(/"/g,'""')+'"'};
  const csv='\uFEFF'+cols.map(c=>cell(c.t)).join(',')+'\r\n'+rows.map(r=>cols.map(c=>cell(r[c.k])).join(',')).join('\r\n');
  dlFile(label+'.csv',csv,'text/csv;charset=utf-8');
}
function exportXLS(cols,rows,label,title){
  const x=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const xml=`<?xml version="1.0" encoding="UTF-8"?>\n<?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="h"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#1C5C44" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/></Style></Styles><Worksheet ss:Name="${x(title).slice(0,28)}"><Table>${'<Row>'+cols.map(c=>`<Cell ss:StyleID="h"><Data ss:Type="String">${x(c.t)}</Data></Cell>`).join('')+'</Row>'}${rows.map(r=>'<Row>'+cols.map(c=>`<Cell><Data ss:Type="String">${x(r[c.k])}</Data></Cell>`).join('')+'</Row>').join('')}</Table></Worksheet></Workbook>`;
  dlFile(label+'.xls',xml,'application/vnd.ms-excel');
}
function printTable(cols,rows,title,sub){
  const w=window.open('','_blank');
  if(!w)return toast('يرجى السماح بالنوافذ المنبثقة لإتمام الطباعة','warn');
  w.document.write(`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>${esc(title)}</title><style>
    body{font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;padding:26px;color:#1c2a22}
    h1{font-size:19px;margin:0 0 4px}p{color:#67766d;margin:0 0 16px;font-size:12px}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th{background:#eef2ef;text-align:right;padding:8px;border-bottom:2px solid #1c5c44}
    td{padding:7px 8px;border-bottom:1px solid #ddd}
    @page{margin:14mm}</style></head><body><h1>${esc(title)}</h1><p>${esc(sub)}</p>
    <table><thead><tr>${cols.map(c=>`<th>${esc(c.t)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c.k])}</td>`).join('')}</tr>`).join('')}</tbody></table></body></html>`);
  w.document.close();setTimeout(()=>w.print(),400);
}

/* ============================================================
   الإقلاع
   ============================================================ */
(async function init(){
  applyTheme(localStorage.getItem('midan_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
  if(!localStorage.getItem(LS))await seedDB();else{DB=JSON.parse(localStorage.getItem(LS));migrateDB()}
  state.user=restoreSession();
  window.addEventListener('hashchange',()=>{if(parseHash().name==='login'&&shellBuiltFor===null)$('#app').classList.add('authwrap')});
  if(!location.hash)location.hash=state.user?'#/dash':'#/login';
  route();
})();
